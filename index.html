<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODIN Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <button command="show-modal" commandfor="my-dialog">add a book</button>

        <dialog id="my-dialog">
            <form method="dialog">
                <div>
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title">
                </div>
                <div>
                    <label for="author">Author</label>
                    <input type="text" name="author" id="author">
                </div>
                <div>
                    <label for="pages">Page's Number</label>
                    <input type="text" name="pages" id="pages">
                </div>
                <div>
                    <p>Did you read it ?</p>
                    <label for="read">Yes</label>
                    <input type="radio" name="read" id="read" value="yes">
                    <label for="no-read">No</label>
                    <input type="radio" name="read" id="no-read" value="no">
                </div>
                <input type="submit" value="Add Book">
            </form>
            <button commandfor="my-dialog" command="close">Close</button>
        </dialog>
        <div class="card-container">
        </div>
    </main>
    <script src="javascript.js"></script>
</body>

</html>
